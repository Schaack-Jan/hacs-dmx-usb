name: Hassfest

# No push, daily schedule, or manual dispatch triggers.
"on":
  pull_request:
    types: [opened, ready_for_review]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hassfest:
    if: github.event_name == 'release' || github.event.pull_request.draft == false
    name: Validate with hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master, 2026-06-22
