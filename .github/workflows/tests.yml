name: Tests

# Branch pushes and later PR commits must not trigger CI.
"on":
  pull_request:
    types: [opened, ready_for_review]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    # A draft PR created with `opened` does not start a runner.
    if: github.event_name == 'release' || github.event.pull_request.draft == false
    name: Pytest and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14.2"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .
