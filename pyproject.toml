[project]
name = "usb-dmx"
version = "0.1.0"
description = "Home Assistant integration for local USB DMX interfaces"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = ["serialx==1.10.0"]

[dependency-groups]
dev = [
    "homeassistant==2026.9.2",
    "pytest==8.3.5",
    "pytest-homeassistant-custom-component==0.13.365",
    "ruff==0.12.11",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Dynamically typed values are required at storage boundaries.
    "COM812", # Conflicts with the formatter.
    "D203", # Home Assistant uses no blank line before class docstrings.
    "D212", # Home Assistant starts multi-line docstrings on the next line.
    "EM101", # Stable validation codes are clearest at the raise site.
    "TC001", # Runtime imports keep the backend contract directly inspectable.
    "TC003", # Runtime imports keep storage boundary types directly inspectable.
    "TID252", # Home Assistant integrations conventionally use relative imports.
    "TRY301", # Inline type guards keep mapping conversion compact.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # Literal protocol boundaries make tests readable.
    "PLR0913", # Fixture factory mirrors all stored fixture fields.
    "S101", # Pytest assertions are expected in tests.
    "SLF001", # Tests exercise protected backend boundary helpers.
]

[tool.ruff.format]
quote-style = "double"
